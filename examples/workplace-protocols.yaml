# Example workplace-protocols.yaml.
#
# Keep one copy on one node of your tailnet, at
# ~/.workplace-protocols/workplace-protocols.yaml, and give that node the ACL
# tag tag:workplace. discovery.Resolve finds the node by that tag and reads the
# file over SSH, so every machine that reads it needs SSH access to that node
# (Tailscale SSH works).
#
# Only `tailnet` is required. Your own tools can add top-level sections and
# parse them from discovery.Manifest.Raw; readers ignore sections they do not
# know.

# Your tailnet's MagicDNS suffix.
tailnet: example.ts.net

# Shared services that tools look up by name.
services:
  - name: postgres
    host: server
    kind: postgres
    tags: [tag:server]

# Your tools, read by the `tools` package.
#
# A tool's `server:` block is a standard MCP Registry server.json, written in
# YAML: https://github.com/modelcontextprotocol/registry/tree/main/docs/reference/server-json
# tools.Resolve turns these into endpoints reachable from the calling machine,
# and tools.Config renders them as `mcpServers` JSON for an MCP client.
#
# Declaring a server grants no authority. It says where a server is, not what a
# caller may do with it.
toolchain:
  tools:
    # ---- local servers -----------------------------------------------------
    # registryType `fleet` means a command you install on your machines
    # yourself. It runs as a stdio subprocess on the calling machine, and
    # `identifier` is the command on PATH. `server.version` must match the
    # tool version (a leading "v" is ignored).
    #
    # Leave `where` off a tool every machine should run. With a `where` tag,
    # the tool only resolves on nodes carrying that tag.

    - name: tracker
      version: v0.2.6
      # role and install_cmd are optional hints for whatever installs your
      # tools. This library stores them and does nothing with them.
      role: agent
      install_cmd: "tracker daemon --install"
      server:
        name: io.github.example/tracker
        description: Workstation and repository state
        version: 0.2.6
        packages:
          - registryType: fleet
            identifier: tracker
            transport: {type: stdio}
            packageArguments:
              - {type: positional, value: mcp}

    - name: deployer
      version: v0.1.9
      server:
        name: io.github.example/deployer
        description: Services, deployments and their health
        version: 0.1.9
        packages:
          - registryType: fleet
            identifier: deployer
            transport: {type: stdio}
            packageArguments:
              - {type: positional, value: mcp}

    - name: search-mcp
      version: v0.1.0
      server:
        name: io.github.example/search
        description: Code search across every indexed repository
        version: 0.1.0
        packages:
          - registryType: fleet
            identifier: search-mcp
            transport: {type: stdio}

    # ---- remote servers ----------------------------------------------------
    # A remote is a streamable-http server running on the first online node
    # that carries the tool's `where` tag. {host} in the url is filled with
    # that node's MagicDNS name. If no such node is online, Resolve reports
    # the tool as unreachable instead of dropping it.

    - name: mailbox
      version: v0.1.4
      where: [tag:server]
      server:
        name: io.github.example/mailbox
        description: Threaded mail between agents and people
        version: 0.1.4
        remotes:
          - type: streamable-http
            url: http://{host}:8788/mcp
            variables:
              host:
                description: MagicDNS name of the node carrying tag:server
                isRequired: true

    # ---- tools without an MCP server ---------------------------------------
    # CLIs and background jobs that agents do not call directly. They stay in
    # the list so their versions are recorded.

    - name: importer
      version: v0.1.2
      build: ./cmd/importer
      where: [tag:server]

    - name: reports
      version: v0.1.1
      where: [tag:server]
